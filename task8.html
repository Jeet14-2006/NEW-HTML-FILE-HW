<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://www.google.com/s2/favicons?sz=64&domain=example.com">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #fdf7ff, #f1fff8, #fffaf2);
            color: #1f2d3d;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #5b3d8c;
            margin-top: 30px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e9dff7;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 18px rgba(74, 55, 96, 0.08);
        }

        iframe,
        video,
        audio,
        embed,
        object {
            width: 100%;
            border: 0;
            border-radius: 12px;
            margin-top: 10px;
        }

        .video-local {
            height: 260px;
            background: #f3ebff;
        }

        .pdf-box {
            height: 500px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Media Hub</h1>

        <div class="grid">
            <div class="card">
                <h2>YouTube Video</h2>
                <iframe src="https://youtu.be/Pd0pjNZ2b6Y" title="YouTube video" allowfullscreen></iframe>
            </div>

            <div class="card">
                <h2>Local Video</h2>
                <video class="video-local" controls>
                    <source src="sample-video.mp4" type="video/mp4">
                    <source src="sample-video.webm" type="video/webm">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="card">
                <h2>Audio Clip</h2>
                <audio controls>
                    <source src="sample-audio.mp3" type="audio/mpeg">
                    <source src="sample-audio.ogg" type="audio/ogg">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="card">
                <h2>Google Map</h2>
                <iframe src="https://www.google.com/maps?q=PCPS%20College%20Kupondole&z=14&output=embed" title="Map to PCPS College, Kupondole" allowfullscreen></iframe>
            </div>

            <div class="card">
                <h2>External Webpage</h2>
                <iframe src="https://www.wikipedia.org" title="Wikipedia page" loading="lazy"></iframe>
            </div>

            <div class="card">
                <h2>PDF Document</h2>
                <embed class="pdf-box" src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" type="application/pdf">
            </div>
        </div>
    </div>
</body>
</html>
